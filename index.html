<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Household Inline Experience — Full Preview</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    html { font-size: 17.5px; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-20">

  <header class="sticky top-0 z-20 bg-white border-b border-slate-200">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="w-9 h-9 rounded-lg bg-slate-100 flex items-center justify-center text-lg font-bold">☰</span>
        <div>
          <h1 class="text-base font-bold leading-tight">Monthly Expenses</h1>
          <p class="text-xs text-slate-500">Interactive Preview (Safe Sandbox)</p>
        </div>
      </div>
      <span class="px-2.5 py-1 rounded-lg bg-teal-50 text-teal-800 text-xs font-semibold">Drive: Synced</span>
    </div>
  </header>

  <main class="flex-1 max-w-md w-full mx-auto px-4 py-4 space-y-4">
    <div class="rounded-2xl bg-gradient-to-br from-teal-700 to-teal-900 text-white p-4 shadow-sm">
      <div class="flex items-center justify-between">
        <span class="text-xs font-medium text-teal-100 uppercase tracking-wider">Total Outflow</span>
        <span class="text-xs px-2 py-0.5 rounded-full bg-white/15">Preview</span>
      </div>
      <div id="heroTotal" class="text-3xl font-bold mt-1">₹71,200</div>
      <div class="grid grid-cols-2 gap-2 mt-3 pt-3 border-t border-white/15 text-xs">
        <div><span class="text-teal-100">Investments:</span> <span class="font-semibold">₹5,000</span></div>
        <div class="text-right"><span class="text-teal-100">Expenses:</span> <span id="heroExp" class="font-semibold">₹66,200</span></div>
      </div>
    </div>

    <div class="flex items-center justify-between">
      <h2 class="text-xs font-bold uppercase tracking-wide text-slate-700">Expenses</h2>
      <button id="btnOpenAdd" type="button" class="text-xs font-semibold text-teal-700">+ Add Expense</button>
    </div>

    <div id="expensesList" class="space-y-2.5"></div>
  </main>

  <nav class="fixed bottom-0 inset-x-0 z-20 bg-white border-t border-slate-200">
    <div class="max-w-md mx-auto grid grid-cols-4 h-16">
      <button type="button" class="flex flex-col items-center justify-center gap-0.5 text-teal-700 font-bold text-xs">
        <span class="text-base">📋</span><span>Monthly</span>
      </button>
      <button type="button" class="flex flex-col items-center justify-center gap-0.5 text-slate-500 font-medium text-xs">
        <span class="text-base">🤝</span><span>Loans</span>
      </button>
      <button type="button" class="flex flex-col items-center justify-center gap-0.5 text-slate-500 font-medium text-xs">
        <span class="text-base">📊</span><span>Summary</span>
      </button>
      <button type="button" class="flex flex-col items-center justify-center gap-0.5 text-slate-500 font-medium text-xs">
        <span class="text-base">🏗️</span><span>Projects</span>
      </button>
    </div>
  </nav>

  <!-- Add Expense Modal -->
  <div id="addDemoModal" class="hidden fixed inset-0 z-50 bg-slate-900/50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-3 shadow-xl">
      <div class="flex items-center justify-between">
        <h3 class="text-base font-bold">Add Expense</h3>
        <button id="btnCloseAdd" type="button" class="text-slate-400 text-xl">&times;</button>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Item / Category</label>
        <input id="inpDemoTitle" type="text" placeholder="e.g. Dmart, Light Bill, Household" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Amount (₹)</label>
        <input id="inpDemoAmt" type="number" placeholder="0" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm" />
      </div>

      <label class="flex items-center gap-2 p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-semibold text-slate-800 cursor-pointer">
        <input id="chkIsHousehold" type="checkbox" class="rounded text-teal-700" />
        <span>Make this an Expandable Household Card</span>
      </label>
      <div class="flex justify-end gap-2 pt-1">
        <button id="btnCancelAdd" type="button" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-600">Cancel</button>
        <button id="btnSaveAdd" type="button" class="px-4 py-2 rounded-lg text-xs font-semibold bg-teal-700 text-white">Save</button>
      </div>
    </div>
  </div>

  <!-- Edit Household Sub-Item Modal -->
  <div id="editSubModal" class="hidden fixed inset-0 z-50 bg-slate-900/50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-3 shadow-xl">
      <div class="flex items-center justify-between">
        <h3 id="subModalTitle" class="text-base font-bold">Edit Item</h3>
        <button id="btnCloseSub" type="button" class="text-slate-400 text-xl">&times;</button>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Type</label>
        <select id="selSubKind" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-xs bg-white">
          <option value="DEDUCTION">Pre-spent Deduction (- Transfer)</option>
          <option value="EXTRA">Extra Pay (+ on top)</option>
          <option value="SODEXO">Sodexo / Fixed Credit</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Label</label>
        <input id="inpSubLabel" type="text" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Amount (₹)</label>
        <input id="inpSubAmt" type="number" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm" />
      </div>
      <div class="flex items-center justify-between pt-2">
        <button id="btnDelSub" type="button" class="text-xs font-semibold text-rose-600">Delete</button>
        <div class="flex gap-2">
          <button id="btnCancelSub" type="button" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-600">Cancel</button>
          <button id="btnSaveSub" type="button" class="px-4 py-2 rounded-lg text-xs font-semibold bg-teal-700 text-white">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Base Fix Modal -->
  <div id="fixModal" class="hidden fixed inset-0 z-50 bg-slate-900/50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-3 shadow-xl">
      <div class="flex items-center justify-between">
        <h3 class="text-base font-bold">Edit Household Base Fix</h3>
        <button id="btnCloseFix" type="button" class="text-slate-400 text-xl">&times;</button>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Card Title</label>
        <input id="inpFixTitle" type="text" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Monthly Base Fix (₹)</label>
        <input id="inpFixAmt" type="number" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm" />
      </div>
      <div class="flex items-center justify-between pt-2">
        <button id="btnDelHouseholdCard" type="button" class="text-xs font-semibold text-rose-600">Delete Household Card</button>
        <div class="flex gap-2">
          <button id="btnCancelFix" type="button" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-600">Cancel</button>
          <button id="btnSaveFix" type="button" class="px-4 py-2 rounded-lg text-xs font-semibold bg-teal-700 text-white">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-semibold px-4 py-2 rounded-full shadow-lg"></div>

  <script>
    let expenses = [
      { id: 'e1', title: 'Monthly Transfer', amount: 25000, isPaid: true, isHousehold: false },
      { id: 'e2', title: 'Household', amount: 25200, isPaid: false, isHousehold: true, baseFix: 23000 },
      { id: 'e3', title: 'Shop Rent', amount: 16000, isPaid: true, isHousehold: false }
    ];
    let hhItems = [
      { id: 1, label: 'Dmart', kind: 'DEDUCTION', amount: 3000 },
      { id: 2, label: 'Sodexo', kind: 'SODEXO', amount: 2200 }
    ];
    let expanded = false;
    let editingSubId = null;

    function fmt(n) {
      return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(n);
    }

    function showToast(m) {
      const t = document.getElementById('toast');
      t.textContent = m;
      t.classList.remove('hidden');
      clearTimeout(t._t);
      t._t = setTimeout(() => t.classList.add('hidden'), 2000);
    }

    function computeHH(baseFix) {
      const ded = hhItems.filter(x => x.kind === 'DEDUCTION').reduce((a, x) => a + x.amount, 0);
      const ext = hhItems.filter(x => x.kind === 'EXTRA').reduce((a, x) => a + x.amount, 0);
      const sod = hhItems.filter(x => x.kind === 'SODEXO').reduce((a, x) => a + x.amount, 0);
      const baseTransfer = baseFix - ded;
      const sendTotal = baseTransfer + ext;
      const hhTotal = baseTransfer + ded + sod + ext;
      return { baseTransfer, sendTotal, hhTotal };
    }

    function render() {
      const hhCard = expenses.find(e => e.isHousehold);
      if (hhCard) {
        hhCard.amount = computeHH(hhCard.baseFix || 23000).hhTotal;
      }
      const expSum = expenses.reduce((a, b) => a + b.amount, 0);
      document.getElementById('heroExp').textContent = fmt(expSum);
      document.getElementById('heroTotal').textContent = fmt(expSum + 5000);

      const listEl = document.getElementById('expensesList');
      listEl.innerHTML = '';

      expenses.forEach(exp => {
        if (!exp.isHousehold) {
          const row = document.createElement('div');
          row.className = 'bg-white rounded-xl border border-slate-200 px-3.5 py-3 flex items-center gap-3';
          row.innerHTML = `
            <button type="button" class="chk-btn w-6 h-6 rounded-full ${exp.isPaid ? 'bg-teal-700 text-white' : 'border-2 border-slate-300 text-transparent'} flex items-center justify-center text-xs shrink-0">✓</button>
            <div class="flex-1 min-w-0">
              <div class="text-sm font-semibold">${exp.title}</div>
              <div class="text-xs text-slate-500">${exp.isPaid ? 'Paid' : 'Pending'}</div>
            </div>
            <div class="text-sm font-bold">${fmt(exp.amount)}</div>
          `;
          row.querySelector('.chk-btn').addEventListener('click', () => { exp.isPaid = !exp.isPaid; render(); });
          listEl.appendChild(row);
          return;
        }

        const { baseTransfer, sendTotal, hhTotal } = computeHH(exp.baseFix || 23000);
        const card = document.createElement('div');
        card.className = 'bg-white rounded-2xl border-2 border-teal-600/40 shadow-sm overflow-hidden';

        const hdr = document.createElement('div');
        hdr.className = 'px-3.5 py-3 flex items-center gap-3 cursor-pointer hover:bg-teal-50/40';
        hdr.innerHTML = `
          <button type="button" class="hh-chk w-6 h-6 rounded-full ${exp.isPaid ? 'bg-teal-700 text-white' : 'border-2 border-slate-300 text-transparent'} flex items-center justify-center text-xs shrink-0">✓</button>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-sm font-bold text-slate-900">${exp.title}</span>
              <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-teal-50 text-teal-800">Send: ${fmt(sendTotal)}</span>
            </div>
            <div class="text-xs text-slate-500 mt-0.5">Tap to ${expanded ? 'collapse' : 'expand'} breakdown</div>
          </div>
          <div class="text-right shrink-0">
            <div class="text-sm font-bold text-slate-900">${fmt(hhTotal)}</div>
            <div class="text-xs text-teal-700 font-semibold">${expanded ? '▲ Hide' : '▼ Expand'}</div>
          </div>
        `;
        hdr.querySelector('.hh-chk').addEventListener('click', (e) => { e.stopPropagation(); exp.isPaid = !exp.isPaid; render(); });
        hdr.addEventListener('click', () => { expanded = !expanded; render(); });
        card.appendChild(hdr);

        if (expanded) {
          const panel = document.createElement('div');
          panel.className = 'border-t border-slate-200 bg-slate-50 p-3.5 space-y-3';
          panel.innerHTML = `
            <div class="rounded-xl bg-slate-800 text-white p-3 flex items-center justify-between gap-2">
              <div>
                <div class="text-xs text-slate-300">Transfer to Send (Fix ${fmt(exp.baseFix || 23000)} − Ded + Extra)</div>
                <div class="text-2xl font-bold text-teal-300 mt-0.5">${fmt(sendTotal)}</div>
              </div>
              <button type="button" class="copy-btn px-3 py-2 rounded-lg bg-teal-600 text-white text-xs font-semibold hover:bg-teal-500 shrink-0">Copy ₹</button>
            </div>
            <div class="flex items-center justify-between gap-2">
              <button type="button" class="add-sub-btn px-2.5 py-1.5 rounded-lg bg-teal-700 text-white text-xs font-semibold">+ Add Item</button>
              <button type="button" class="edit-fix-btn px-2.5 py-1.5 rounded-lg bg-white border border-slate-300 text-slate-700 text-xs font-semibold">Edit Fix / Delete Card</button>
            </div>
            <div class="sub-list space-y-1.5"></div>
          `;
          panel.querySelector('.copy-btn').addEventListener('click', () => {
            if (navigator.clipboard) navigator.clipboard.writeText(String(sendTotal)).catch(() => {});
            showToast(`Copied ₹${sendTotal}`);
          });
          panel.querySelector('.add-sub-btn').addEventListener('click', () => openSubModal(null));
          panel.querySelector('.edit-fix-btn').addEventListener('click', () => {
            document.getElementById('inpFixTitle').value = exp.title;
            document.getElementById('inpFixAmt').value = exp.baseFix || 23000;
            document.getElementById('fixModal').classList.remove('hidden');
          });

          const subList = panel.querySelector('.sub-list');
          const tr = document.createElement('div');
          tr.className = 'bg-white rounded-lg border border-slate-200 px-3 py-2 flex items-center justify-between text-xs';
          tr.innerHTML = `<div><span class="font-semibold">Transfer</span> <span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 font-bold">AUTO</span></div><span class="font-bold text-teal-700">${fmt(baseTransfer)}</span>`;
          subList.appendChild(tr);

          hhItems.forEach(it => {
            const r = document.createElement('div');
            r.className = 'bg-white rounded-lg border border-slate-200 px-3 py-2 flex items-center justify-between text-xs cursor-pointer hover:border-teal-400';
            const isDed = it.kind === 'DEDUCTION';
            const isExt = it.kind === 'EXTRA';
            const badge = isDed ? '<span class="px-1.5 py-0.5 rounded bg-rose-50 text-rose-700 font-bold">- TRANSFER</span>'
              : (isExt ? '<span class="px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 font-bold">+ EXTRA</span>'
              : '<span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 font-bold">SODEXO</span>');
            r.innerHTML = `<div><span class="font-semibold">${it.label}</span> ${badge}</div><span class="font-bold ${isDed ? 'text-rose-600' : 'text-teal-700'}">${fmt(it.amount)}</span>`;
            r.addEventListener('click', () => openSubModal(it));
            subList.appendChild(r);
          });

          card.appendChild(panel);
        }
        listEl.appendChild(card);
      });
    }

    function openSubModal(it) {
      editingSubId = it ? it.id : null;
      document.getElementById('subModalTitle').textContent = it ? 'Edit Household Item' : 'Add Household Item';
      document.getElementById('selSubKind').value = it ? it.kind : 'DEDUCTION';
      document.getElementById('inpSubLabel').value = it ? it.label : '';
      document.getElementById('inpSubAmt').value = it ? it.amount : '';
      document.getElementById('btnDelSub').classList.toggle('hidden', !it);
      document.getElementById('editSubModal').classList.remove('hidden');
    }

    document.getElementById('btnCloseSub').addEventListener('click', () => document.getElementById('editSubModal').classList.add('hidden'));
    document.getElementById('btnCancelSub').addEventListener('click', () => document.getElementById('editSubModal').classList.add('hidden'));
    document.getElementById('btnSaveSub').addEventListener('click', () => {
      const kind = document.getElementById('selSubKind').value;
      const label = document.getElementById('inpSubLabel').value.trim();
      const amount = Number(document.getElementById('inpSubAmt').value) || 0;
      if (!label) { showToast('Enter label'); return; }
      if (editingSubId) {
        const it = hhItems.find(x => x.id === editingSubId);
        if (it) { it.kind = kind; it.label = label; it.amount = amount; }
      } else {
        hhItems.push({ id: Date.now(), label, kind, amount });
      }
      document.getElementById('editSubModal').classList.add('hidden');
      render();
      showToast('Updated');
    });
    document.getElementById('btnDelSub').addEventListener('click', () => {
      hhItems = hhItems.filter(x => x.id !== editingSubId);
      document.getElementById('editSubModal').classList.add('hidden');
      render();
      showToast('Deleted');
    });

    document.getElementById('btnCloseFix').addEventListener('click', () => document.getElementById('fixModal').classList.add('hidden'));
    document.getElementById('btnCancelFix').addEventListener('click', () => document.getElementById('fixModal').classList.add('hidden'));
    document.getElementById('btnSaveFix').addEventListener('click', () => {
      const hhCard = expenses.find(e => e.isHousehold);
      if (hhCard) {
        hhCard.title = document.getElementById('inpFixTitle').value.trim() || 'Household';
        hhCard.baseFix = Number(document.getElementById('inpFixAmt').value) || 23000;
      }
      document.getElementById('fixModal').classList.add('hidden');
      render();
      showToast('Base fix updated');
    });
    document.getElementById('btnDelHouseholdCard').addEventListener('click', () => {
      expenses = expenses.filter(e => !e.isHousehold);
      document.getElementById('fixModal').classList.add('hidden');
      render();
      showToast('Household card deleted');
    });

    document.getElementById('btnOpenAdd').addEventListener('click', () => {
      document.getElementById('inpDemoTitle').value = '';
      document.getElementById('inpDemoAmt').value = '';
      document.getElementById('chkIsHousehold').checked = false;
      document.getElementById('addDemoModal').classList.remove('hidden');
    });
    document.getElementById('btnCloseAdd').addEventListener('click', () => document.getElementById('addDemoModal').classList.add('hidden'));
    document.getElementById('btnCancelAdd').addEventListener('click', () => document.getElementById('addDemoModal').classList.add('hidden'));
    document.getElementById('btnSaveAdd').addEventListener('click', () => {
      const tit = document.getElementById('inpDemoTitle').value.trim() || 'Expense';
      const amt = Number(document.getElementById('inpDemoAmt').value) || 0;
      const isHH = document.getElementById('chkIsHousehold').checked;
      expenses.push({ id: 'e-' + Date.now(), title: tit, amount: amt, isPaid: false, isHousehold: isHH, baseFix: 23000 });
      document.getElementById('addDemoModal').classList.add('hidden');
      render();
      showToast('Saved');
    });

    render();
  </script>
</body>
</html>
